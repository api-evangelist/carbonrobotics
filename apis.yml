name: Carbon Robotics
description: 'Carbon Robotics is a Seattle-based physical-AI and agricultural robotics
  company building autonomous systems that help farmers cut costs and reduce chemical
  use. Its flagship LaserWeeder G2 uses computer vision and high-power lasers to eliminate
  weeds without herbicides, and its Carbon Autonomy product adds remote-supervised
  autonomy to compatible John Deere tractors. The underlying Carbon AI Large Plant
  Model is trained on 150 million labeled plants across 15 countries and 100+ crops.
  Carbon Robotics operates a customer grower cloud portal and Starlink-connected fleet
  control, but publishes no public developer API, OpenAPI, SDKs, or developer portal
  as of this profiling.'
